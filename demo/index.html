      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b0c0a;
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      canvas { display: block; }
      #hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
        color: #f3ead6;
        text-shadow: 0 1px 2px #000c;
      }
      #crosshair {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 10px;
        height: 10px;
        margin: -5px 0 0 -5px;
        border: 1.5px solid rgba(243, 234, 214, 0.85);
        border-radius: 50%;
        box-shadow: 0 0 0 1px #0008;
      }
      #prompt {
        position: absolute;
        left: 50%;
        top: 58%;
        transform: translateX(-50%);
        font-size: 15px;
        letter-spacing: 0.04em;
        opacity: 0;
        transition: opacity 120ms linear;
      }
      #prompt.show { opacity: 1; }
      #status {
        position: absolute;
        left: 22px;
        bottom: 22px;
        font-size: 13px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        opacity: 0.92;
      }
      #hint {
        position: absolute;
        left: 22px;
        bottom: 42px;
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        opacity: 0.55;
      }
      #speedo {
        position: absolute;
        right: 28px;
        bottom: 22px;
        text-align: right;
        opacity: 0;
        transition: opacity 160ms linear;
      }
      #speedo.show { opacity: 1; }
      #speedo-num {
        font-size: 44px;
        line-height: 1;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.02em;
      }
      #speedo-unit {
        font-size: 11px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        opacity: 0.7;
      }
      #fade {
        position: absolute;
        inset: 0;
        background: #000;
        opacity: 0;
        transition: opacity 420ms ease;
      }
      #fade.on { opacity: 1; }
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #0b0c0a;
        color: #d8c7a4;
        z-index: 20;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        font-size: 12px;
      }
      #boot-bar {
        width: 180px;
        height: 2px;
        margin-top: 16px;
        background: #2a2418;
      }
      #boot-fill {
        width: 0;
        height: 100%;
        background: #c4783a;
      }
