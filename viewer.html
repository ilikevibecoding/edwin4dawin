<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kyber Star — model viewer</title>
<style>
  html, body { margin: 0; height: 100%; background: #05070a; overflow: hidden; }
  canvas { display: block; }
  #hud { position: fixed; left: 12px; top: 10px; font: 12px/1.5 ui-monospace, monospace; color: #7fd8ff; opacity: .8; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/addons/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { Engine } from './src/core/engine.js';
import * as capital from './src/models/capital.js';
import * as fighters from './src/models/fighters.js';
import * as civilian from './src/models/civilian.js';
import * as droids from './src/models/droids.js';
import * as chars from './src/models/chars.js';
import * as station from './src/models/station.js';
import * as props from './src/models/props.js';
import { starfield } from './src/worlds/space.js';

const q = new URLSearchParams(location.search);
const name = q.get('model') || 'xwing';
const W = +(q.get('w') || 900), H = +(q.get('h') || 600);
const distMul = +(q.get('dist') || 1);
const showGrid = q.get('grid') !== '0';

const engine = new Engine(document.getElementById('c'), { fixedSize: [W, H], quality: 'high', preserveDrawingBuffer: true });
engine.letterbox = 0;
engine.grain = 0.02;
engine.vignette = 0.5;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0e14);
const camera = new THREE.PerspectiveCamera(35, W / H, 0.01, 400000);

const factories = {
  ...capital, ...fighters, ...civilian, ...droids, ...chars, ...station, ...props,
};

let obj;
try {
  const fn = factories[name];
  if (!fn) throw new Error(`unknown model "${name}". known: ${Object.keys(factories).join(', ')}`);
  obj = fn({});
} catch (e) {
  document.getElementById('hud').textContent = e.message;
  throw e;
}
scene.add(obj);

const bbox = new THREE.Box3().setFromObject(obj);
const size = bbox.getSize(new THREE.Vector3());
const center = bbox.getCenter(new THREE.Vector3());
const radius = Math.max(size.x, size.y, size.z) * 0.5 || 1;

// Three-point lighting so shapes read clearly in the audit shots.
scene.add(new THREE.AmbientLight(0x3d4c60, 1.6));
const key = new THREE.DirectionalLight(0xfff2dc, 3.4); key.position.set(1, 1.2, 0.8).multiplyScalar(radius * 5); scene.add(key);
const fill = new THREE.DirectionalLight(0x6f96d8, 1.3); fill.position.set(-1.2, 0.3, -0.6).multiplyScalar(radius * 5); scene.add(fill);
const rim = new THREE.DirectionalLight(0xffd9a0, 2.0); rim.position.set(-0.4, 0.6, -1.4).multiplyScalar(radius * 5); scene.add(rim);

if (showGrid) {
  const grid = new THREE.GridHelper(radius * 6, 24, 0x224466, 0x122233);
  grid.position.y = bbox.min.y - radius * 0.02;
  scene.add(grid);
}
scene.add(starfield({ count: 900, radius: radius * 120 }));

engine.setActive(scene, camera);

const hud = document.getElementById('hud');
let tris = 0;
function frame(angleDeg, elevDeg = 18, t = 0) {
  const a = angleDeg * Math.PI / 180;
  const e = elevDeg * Math.PI / 180;
  const d = radius * 3.6 * distMul;
  camera.position.set(
    center.x + Math.sin(a) * Math.cos(e) * d,
    center.y + Math.sin(e) * d,
    center.z + Math.cos(a) * Math.cos(e) * d,
  );
  camera.lookAt(center);
  camera.near = Math.max(0.001, d * 0.01);
  camera.far = d * 40;
  camera.updateProjectionMatrix();
  if (obj.userData.step) obj.userData.step(t);
  if (obj.userData.lookAround) obj.userData.lookAround(t);
  if (obj.userData.swayCape) obj.userData.swayCape(t);
  engine.render(t);
  engine.flush();
  tris = engine.renderer.info.render.triangles;
  hud.textContent = `${name}  size=${size.x.toFixed(1)}x${size.y.toFixed(1)}x${size.z.toFixed(1)}  calls=${engine.renderer.info.render.calls}`;
}
window.__frame = frame;
window.__info = () => ({ name, size: size.toArray(), radius, calls: engine.renderer.info.render.calls, tris });
frame(35);
window.__ready = true;

// Live orbit when opened by a human.
if (!q.has('static')) {
  let t0 = performance.now();
  (function loop() {
    const t = (performance.now() - t0) / 1000;
    frame(35 + t * 12, 18 + Math.sin(t * 0.3) * 8, t);
    requestAnimationFrame(loop);
  })();
}
</script>
</body>
</html>
