<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>Northstar Rescue — Tactical Response Vertical Slice</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230e2233'/%3E%3Cpath d='M16 4l3 9h9l-7.5 5.5 3 9L16 22l-7.5 5.5 3-9L4 13h9z' fill='%237fd4e8'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./src/ui/styles.css" />
  </head>
  <body>
    <div id="app">
      <!-- Single primary game canvas. Everything 3D renders here. -->
      <canvas id="game-canvas" tabindex="0" aria-label="Northstar Rescue game viewport"></canvas>
      <!-- DOM overlay for HUD and menus, mounted by src/ui.
           Only the announcer and subtitle regions are live; announcing every
           ammo tick would bury the messages that matter. -->
      <div id="ui-root"></div>
      <noscript>
        <p class="noscript">Northstar Rescue requires JavaScript and a WebGL2-capable browser.</p>
      </noscript>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
