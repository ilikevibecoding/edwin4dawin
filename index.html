<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Abyssal Surveyor — Interior</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #05070a;
        font-family: "IBM Plex Mono", "SF Mono", "Consolas", monospace;
      }
      #app, canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
        color: #d7c7a6;
      }
      #crosshair {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 8px;
        height: 8px;
        margin: -4px 0 0 -4px;
        border: 1px solid rgba(215, 199, 166, 0.55);
        border-radius: 50%;
      }
      #prompt {
        position: absolute;
        left: 50%;
        bottom: 18%;
        transform: translateX(-50%);
        font-size: 14px;
        letter-spacing: 0.04em;
        text-shadow: 0 1px 8px #000;
        opacity: 0;
        transition: opacity 120ms linear;
      }
      #prompt.visible { opacity: 1; }
      #status {
        position: absolute;
        left: 50%;
        bottom: 12%;
        transform: translateX(-50%);
        font-size: 13px;
        color: #c9b48a;
        text-shadow: 0 1px 8px #000;
        opacity: 0;
      }
      #fade {
        position: absolute;
        inset: 0;
        background: #000;
        opacity: 0;
      }
      #hint {
        position: absolute;
        left: 24px;
        bottom: 20px;
        font-size: 12px;
        color: rgba(215, 199, 166, 0.55);
        line-height: 1.5;
      }
      #blocker {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(4, 7, 10, 0.72);
        color: #d7c7a6;
        cursor: pointer;
        z-index: 4;
      }
      #blocker.hidden { display: none; }
      #blocker .card {
        max-width: 420px;
        padding: 28px 32px;
        border: 1px solid rgba(215, 199, 166, 0.18);
        background: rgba(12, 16, 20, 0.86);
      }
      #blocker h1 {
        margin: 0 0 10px;
        font-size: 18px;
        font-weight: 500;
        letter-spacing: 0.08em;
      }
      #blocker p {
        margin: 0;
        font-size: 13px;
        line-height: 1.55;
        color: #b7aa90;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">
      <div id="crosshair"></div>
      <div id="prompt"></div>
      <div id="status"></div>
      <div id="fade"></div>
      <div id="hint">WASD move · mouse look · E interact · Esc release</div>
    </div>
    <div id="blocker">
      <div class="card">
        <h1>ABYSSAL SURVEYOR</h1>
        <p>Click to enter the pressure hull. Walk from the forward control room to the aft machinery space.</p>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
