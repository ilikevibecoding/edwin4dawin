<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#07090b" />
    <meta
      name="description"
      content="Operation Blackout — a AAA-grade first-person shooter running entirely in the browser on Three.js."
    />
    <title>OPERATION BLACKOUT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --hud-accent: #d8ff4a;
        --hud-danger: #ff3b30;
        --hud-warn: #ffb020;
        --hud-dim: rgba(226, 232, 240, 0.55);
        --hud-text: #e8edf2;
        --bg: #07090b;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--hud-text);
        font-family: 'Barlow', system-ui, -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
        overscroll-behavior: none;
        touch-action: none;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #game-canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        cursor: none;
        image-rendering: auto;
      }
      #game-canvas.unlocked {
        cursor: default;
      }
      #ui-root {
        position: absolute;
        inset: 0;
        pointer-events: none;
        user-select: none;
        z-index: 10;
      }
      #ui-root > * {
        pointer-events: none;
      }

      /* ---------- Boot screen ---------- */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        background:
          radial-gradient(120% 80% at 50% 0%, #10161c 0%, #07090b 60%, #040507 100%);
        transition: opacity 0.7s ease, visibility 0.7s;
      }
      #boot.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      #boot::after {
        content: '';
        position: absolute;
        inset: 0;
        pointer-events: none;
        background-image: repeating-linear-gradient(
          0deg,
          rgba(255, 255, 255, 0.022) 0px,
          rgba(255, 255, 255, 0.022) 1px,
          transparent 1px,
          transparent 3px
        );
        mix-blend-mode: overlay;
      }
      .boot-title {
        font-family: 'Barlow Condensed', sans-serif;
        font-weight: 700;
        font-size: clamp(38px, 7.5vw, 96px);
        letter-spacing: 0.14em;
        margin: 0;
        line-height: 0.95;
        text-transform: uppercase;
        background: linear-gradient(180deg, #ffffff 0%, #8e9aa6 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        filter: drop-shadow(0 6px 30px rgba(0, 0, 0, 0.8));
      }
      .boot-sub {
        font-family: 'JetBrains Mono', monospace;
        font-size: clamp(9px, 1.2vw, 12px);
        letter-spacing: 0.42em;
        text-transform: uppercase;
        color: var(--hud-dim);
        margin: -18px 0 0;
        padding-left: 0.42em;
      }
      .boot-bar {
        position: relative;
        width: min(460px, 62vw);
        height: 2px;
        background: rgba(255, 255, 255, 0.09);
        overflow: hidden;
      }
      .boot-bar-fill {
        position: absolute;
        inset: 0 auto 0 0;
        width: 0%;
        background: linear-gradient(90deg, rgba(216, 255, 74, 0.4), var(--hud-accent));
        box-shadow: 0 0 14px rgba(216, 255, 74, 0.55);
        transition: width 0.25s ease;
      }
      .boot-status {
        font-family: 'JetBrains Mono', monospace;
        font-size: 10px;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: rgba(226, 232, 240, 0.4);
        min-height: 14px;
      }
      #boot-error {
        display: none;
        max-width: min(680px, 84vw);
        padding: 18px 22px;
        border: 1px solid rgba(255, 59, 48, 0.4);
        background: rgba(255, 59, 48, 0.07);
        font-family: 'JetBrains Mono', monospace;
        font-size: 12px;
        line-height: 1.7;
        color: #ffb4ae;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .noscript {
        font-family: 'JetBrains Mono', monospace;
        color: #ffb4ae;
        text-align: center;
        padding: 40px;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas"></canvas>
      <div id="ui-root"></div>
    </div>

    <div id="boot">
      <h1 class="boot-title">Operation Blackout</h1>
      <p class="boot-sub">Tactical Response Division</p>
      <div class="boot-bar"><div class="boot-bar-fill" id="boot-bar-fill"></div></div>
      <div class="boot-status" id="boot-status">Initialising</div>
      <pre id="boot-error"></pre>
    </div>

    <noscript>
      <div class="noscript">This game requires JavaScript and WebGL 2.</div>
    </noscript>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
