<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ridgeline Trail — procedural offroad showcase</title>
    <style>
      :root {
        --ink: #e9e3d8;
        --dim: rgba(233, 227, 216, 0.55);
        --accent: #ff9a3c;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: #0b0d0c;
        overflow: hidden;
        font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        color: var(--ink);
      }
      canvas { display: block; }

      .hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
      .hud-corner { position: absolute; padding: 22px 26px; }
      .hud-tl { top: 0; left: 0; }
      .hud-bl { bottom: 0; left: 0; }
      .hud-br { bottom: 0; right: 0; text-align: right; }

      .hud-title {
        font-size: 12px;
        letter-spacing: 0.42em;
        font-weight: 700;
        text-transform: uppercase;
        color: var(--ink);
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.85);
      }
      .hud-sub {
        margin-top: 6px;
        font-size: 11.5px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--dim);
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
      }
      .hud-speed {
        font-size: 46px;
        font-weight: 200;
        line-height: 0.9;
        font-variant-numeric: tabular-nums;
        text-shadow: 0 3px 18px rgba(0, 0, 0, 0.9);
      }
      .hud-speed em {
        font-size: 12px;
        font-style: normal;
        letter-spacing: 0.24em;
        margin-left: 8px;
        color: var(--accent);
      }
      .hud-keys {
        display: flex;
        gap: 18px;
        font-size: 10.5px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--dim);
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
      }
      .hud-keys b { color: var(--ink); font-weight: 600; }

      .hud-fade {
        position: absolute;
        inset: 0;
        background: #06070a;
        opacity: 0;
        transition: opacity 0.45s ease;
      }

      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 14px;
        justify-items: center;
        background: #0b0d0c;
        z-index: 20;
        transition: opacity 0.6s ease;
      }
      #boot.done { opacity: 0; pointer-events: none; }
      #boot .bar { width: 220px; height: 2px; background: rgba(255, 255, 255, 0.12); overflow: hidden; }
      #boot .bar i { display: block; height: 100%; width: 30%; background: var(--accent); transition: width 0.3s ease; }
      #boot .label { font-size: 11px; letter-spacing: 0.34em; text-transform: uppercase; color: var(--dim); }
    </style>
  </head>
  <body>
    <div id="boot">
      <div class="label" id="boot-label">Generating terrain</div>
      <div class="bar"><i id="boot-bar"></i></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
