<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>LEGO Star Wars — A New Hope</title>
<meta name="description" content="A procedurally generated LEGO Star Wars cinematic: every brick, sound and title built from code in three.js." />
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden;
    font-family: Arimo, "Liberation Sans", "DejaVu Sans", system-ui, sans-serif; color: #e8ecef; }
  #stage { position: fixed; inset: 0; display: grid; place-items: center; background: #000; }
  canvas#c { display: block; width: 100%; height: 100%; object-fit: contain; }

  .layer { position: fixed; inset: 0; pointer-events: none; }

  /* ---- captions ---- */
  #captions { position: fixed; left: 50%; transform: translateX(-50%);
    bottom: clamp(48px, 11vh, 130px); width: min(78vw, 1000px); text-align: center;
    font-size: clamp(15px, 2.05vw, 27px); line-height: 1.34; letter-spacing: .01em;
    text-shadow: 0 2px 10px rgba(0,0,0,.95), 0 0 26px rgba(0,0,0,.85);
    opacity: 0; transition: opacity .22s ease; pointer-events: none; }
  #captions.on { opacity: 1; }
  #captions .who { display: block; font-size: .62em; letter-spacing: .22em;
    color: #ffd54a; margin-bottom: .34em; text-transform: uppercase; }
  #captions .txt { display: inline; color: #f4f7f9; }

  /* ---- chapter cards ---- */
  #chapter { position: fixed; inset: 0; display: grid; place-items: center; opacity: 0;
    transition: opacity .5s ease; }
  #chapter .inner { text-align: center; }
  #chapter .t { font-size: clamp(26px, 5.2vw, 74px); font-weight: 700; letter-spacing: .26em;
    color: #ffd54a; text-shadow: 0 0 46px rgba(255,193,60,.5); }
  #chapter .s { margin-top: .7em; font-size: clamp(11px, 1.5vw, 19px); letter-spacing: .42em;
    color: #b9c4cc; text-transform: uppercase; }

  /* ---- start screen ---- */
  #start { position: fixed; inset: 0; display: grid; place-items: center; background: #000;
    transition: opacity .8s ease; z-index: 20; }
  #start.gone { opacity: 0; pointer-events: none; }
  #start .box { text-align: center; max-width: 760px; padding: 24px; }
  #start .logo { width: min(72vw, 720px); margin: 0 auto 6px; }
  #start .logo svg { width: 100%; height: auto; display: block; }
  #start h1 { margin: 0 0 4px; font-size: clamp(19px, 3vw, 34px); font-weight: 700;
    letter-spacing: .3em; color: #ffd54a; }
  #start p { margin: 14px auto 0; max-width: 54ch; color: #93a1ab; font-size: 14.5px; line-height: 1.62; }
  #start .bar { margin: 30px auto 0; width: min(60vw, 460px); height: 3px;
    background: #1c2227; border-radius: 3px; overflow: hidden; }
  #start .bar i { display: block; height: 100%; width: 0%; background: #ffd54a;
    transition: width .3s ease; }
  #start .status { margin-top: 12px; font-size: 12px; letter-spacing: .18em; color: #6a7780;
    text-transform: uppercase; min-height: 1.2em; }
  #play { margin-top: 26px; pointer-events: auto; cursor: pointer;
    background: transparent; color: #0b0d0f; background: #ffd54a; border: 0;
    padding: 14px 46px; font: 700 15px/1 Arimo, sans-serif; letter-spacing: .3em;
    border-radius: 2px; text-transform: uppercase; transition: transform .15s ease, box-shadow .2s ease; }
  #play:hover { transform: translateY(-1px); box-shadow: 0 8px 30px rgba(255,213,74,.28); }
  #play[disabled] { opacity: .25; cursor: default; transform: none; box-shadow: none; }

  /* ---- transport ---- */
  #transport { position: fixed; left: 0; right: 0; bottom: 0; height: 40px; display: flex;
    align-items: center; gap: 14px; padding: 0 16px; opacity: 0; transition: opacity .3s ease;
    pointer-events: auto; background: linear-gradient(to top, rgba(0,0,0,.72), transparent); z-index: 10; }
  #stage:hover #transport, #transport.show { opacity: 1; }
  #transport .time { font: 11px/1 ui-monospace, monospace; color: #9fb0ba; letter-spacing: .08em; }
  #transport .track { flex: 1; height: 3px; background: rgba(255,255,255,.16); border-radius: 3px; cursor: pointer; }
  #transport .track i { display: block; height: 100%; width: 0; background: #ffd54a; border-radius: 3px; }
  #transport button { background: none; border: 0; color: #cfd8de; cursor: pointer; font-size: 15px; padding: 4px 8px; }

  #dev { position: fixed; left: 10px; top: 8px; font: 11px/1.5 ui-monospace, monospace;
    color: #7fe3a0; white-space: pre; text-shadow: 0 1px 3px #000; display: none; }
  #dev.on { display: block; }

  #fatal { position: fixed; inset: 0; display: none; place-items: center; background: #000; z-index: 40; padding: 40px; }
  #fatal.on { display: grid; }
  #fatal pre { color: #ff8b7a; font: 12px/1.6 ui-monospace, monospace; white-space: pre-wrap; max-width: 900px; }
</style>
</head>
<body>
  <div id="stage">
    <canvas id="c"></canvas>
    <div class="layer" id="chapter"><div class="inner"><div class="t"></div><div class="s"></div></div></div>
    <div id="captions"><span class="who"></span><span class="txt"></span></div>
    <div id="transport">
      <button id="tPlay" title="play / pause">&#9208;</button>
      <div class="track" id="tTrack"><i></i></div>
      <div class="time" id="tTime">0:00 / 0:00</div>
      <button id="tFull" title="fullscreen">&#9974;</button>
    </div>
    <div id="dev"></div>
  </div>

  <div id="start">
    <div class="box">
      <div class="logo" id="startLogo"></div>
      <p>
        A short film in which every brick, every sound and every title card is generated
        by code. No models, no textures, no samples — the orchestra is oscillators, the
        artwork is SVG, and the galaxy is about forty thousand LEGO parts placed one at a time.
      </p>
      <div class="bar"><i id="loadBar"></i></div>
      <div class="status" id="loadStatus">initialising</div>
      <button id="play" disabled>Play</button>
    </div>
  </div>

  <div id="fatal"><pre id="fatalMsg"></pre></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
