<!doctype html>

  <head>

    <link rel="icon" href="data:," />

  <body>
    <canvas id="view"></canvas>

    <div id="hud">
      <div id="crosshair"></div>
      <div id="prompt" class="hidden"></div>
      <div id="status">
        <span id="status-tag">ISD VIGILANT</span>
        <span id="status-text">Systems nominal. Holding station.</span>
      </div>
      <div id="location"></div>
      <div id="modehint"></div>
      <div id="stats" class="hidden"></div>

    <div id="fade">
      <div id="fade-text"></div>

    <div id="start">
      <div class="card">
        <h1>ISD VIGILANT</h1>
        <p class="sub">Imperial-class Star Destroyer · holding station</p>
        <p class="hint">Click to take the deck</p>
        <p class="keys">WASD move · Shift run · mouse look · E interact · V exterior view · Esc release</p>
        <a class="scene-link" href="./battle.html">Battle of Coruscant →</a>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
