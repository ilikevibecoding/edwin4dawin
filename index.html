<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ASHFALL PROTOCOL</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    #app { position: fixed; inset: 0; }
    canvas { display: block; }
    /* Painted before the (heavy, synchronous) module executes, so the tab
       never looks dead while the procedural world builds. */
    #boot {
      position: fixed; inset: 0; display: flex; flex-direction: column; gap: 18px;
      align-items: center; justify-content: center; background: #06070a;
      color: #e9e6de; font-family: system-ui, sans-serif; z-index: 10;
    }
    #boot .t { font-size: 15px; letter-spacing: 0.5em; padding-left: 0.5em; font-weight: 700; }
    #boot .s { font-size: 10px; letter-spacing: 0.3em; padding-left: 0.3em; color: #8f8a82; animation: bootPulse 1.4s ease-in-out infinite; }
    @keyframes bootPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
  </style>
</head>
<body>
  <div id="boot"><div class="t">ASHFALL PROTOCOL</div><div class="s">DEPLOYING TO DUST DISTRICT…</div></div>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
