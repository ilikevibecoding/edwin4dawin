<?xml version="1.0" encoding="UTF-8"?>
<!--
  Astromech dome front print.
  Raster asset. Transparent background - the silver dome shows through.
  Main holo lens, three small sensors and two service panels.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">

  <!-- dome seam -->
  <rect x="48" y="120" width="416" height="14" fill="#a0a5a9"/>

  <!-- main lens -->
  <circle cx="256" cy="228" r="92" fill="#1b2a34"/>
  <circle cx="256" cy="228" r="74" fill="#a0a5a9"/>
  <circle cx="256" cy="228" r="56" fill="#1b2a34"/>
  <circle cx="256" cy="228" r="26" fill="#0055bf"/>
  <circle cx="238" cy="210" r="10" fill="#a0a5a9"/>

  <!-- small sensors -->
  <circle cx="118" cy="196" r="26" fill="#1b2a34"/>
  <circle cx="118" cy="196" r="13" fill="#0055bf"/>
  <circle cx="394" cy="196" r="26" fill="#1b2a34"/>
  <circle cx="394" cy="196" r="13" fill="#a0a5a9"/>
  <circle cx="256" cy="376" r="22" fill="#1b2a34"/>
  <circle cx="256" cy="376" r="10" fill="#0055bf"/>

  <!-- service panels -->
  <rect x="76" y="286" width="118" height="86" rx="8" fill="#1b2a34"/>
  <rect x="88" y="298" width="94" height="62" rx="4" fill="#a0a5a9"/>
  <rect x="318" y="286" width="118" height="86" rx="8" fill="#1b2a34"/>
  <rect x="330" y="298" width="94" height="26" rx="4" fill="#0055bf"/>
  <rect x="330" y="334" width="94" height="26" rx="4" fill="#a0a5a9"/>

  <!-- lower band -->
  <rect x="60" y="414" width="392" height="18" fill="#a0a5a9"/>
  <rect x="150" y="446" width="212" height="26" rx="6" fill="#0055bf"/>

</svg>
