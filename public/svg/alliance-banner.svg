<?xml version="1.0" encoding="UTF-8"?>
<!--
  Hanging alliance banner.
  Raster asset. NOT transparent: the blue field is the cloth.
  Starbird centred in the upper half, two bars near the foot.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 800" width="300" height="800">

  <!-- cloth -->
  <rect x="0" y="0" width="300" height="800" fill="#0a3463"/>

  <!-- hanging bar and shadow line -->
  <rect x="0" y="0" width="300" height="26" fill="#082849"/>
  <rect x="0" y="26" width="300" height="6" fill="#0d3f74"/>

  <!-- starbird, scaled to 0.53 of the crest drawing -->
  <path fill="#f2cd37" d="M150 130.2
    C156.4 157.8 160.6 187.5 164.8 216.1
    C185 189.6 215.7 163.1 253.9 146.1
    C244.3 181.1 222.1 217.1 192.4 241.5
    C189.2 274.4 183.9 316.8 171.2 354.9
    L150 369.8
    L128.8 354.9
    C116.1 316.8 110.8 274.4 107.6 241.5
    C77.9 217.1 55.7 181.1 46.1 146.1
    C84.3 163.1 115 189.6 135.2 216.1
    C139.4 187.5 143.6 157.8 150 130.2
    Z"/>

  <!-- two bars near the foot -->
  <rect x="40" y="612" width="220" height="34" fill="#f2cd37"/>
  <rect x="40" y="678" width="220" height="34" fill="#f2cd37"/>

  <!-- foot hem -->
  <rect x="0" y="768" width="300" height="32" fill="#082849"/>

</svg>
