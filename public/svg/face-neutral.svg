<?xml version="1.0" encoding="UTF-8"?>
<!--
  Minifigure face print: neutral.
  Raster asset. Transparent - the head colour shows through.
  Eye line y=210, features kept inside the central 60% of the canvas.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">

  <!-- eyes -->
  <ellipse cx="196" cy="210" rx="26" ry="32" fill="#1b2a34"/>
  <ellipse cx="316" cy="210" rx="26" ry="32" fill="#1b2a34"/>

  <!-- closed smile, ends flicked up -->
  <path fill="none" stroke="#1b2a34" stroke-width="16" stroke-linecap="round"
        d="M186 288 C204 342 308 342 326 288"/>

</svg>
