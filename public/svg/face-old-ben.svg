<?xml version="1.0" encoding="UTF-8"?>
<!--
  Minifigure face print: old hermit.
  Raster asset. Transparent background.
  Grey beard and moustache fill the lower half, crow's feet at the eyes.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">

  <!-- beard: sideburns start below the cheekbone, sides fall inwards and the
       mass tapers to a rounded chin so it does not read as a bib -->
  <path fill="#c8c8c8" d="M148 268
    C138 340 156 412 196 448 C220 470 292 470 316 448
    C356 412 374 340 364 268
    C350 296 322 310 292 312 C276 314 236 314 220 312
    C190 310 162 296 148 268Z"/>

  <!-- moustache, drawn over the beard -->
  <path fill="#c8c8c8" d="M256 282
    C232 264 196 258 168 268 C186 292 214 306 244 306
    C250 306 262 306 268 306 C298 306 326 292 344 268
    C316 258 280 264 256 282Z"/>

  <!-- mouth slot between moustache and beard -->
  <path fill="none" stroke="#8e8e8e" stroke-width="9" stroke-linecap="round"
        d="M212 324 C238 340 274 340 300 324"/>

  <!-- eyes -->
  <ellipse cx="196" cy="206" rx="24" ry="28" fill="#1b2a34"/>
  <ellipse cx="316" cy="206" rx="24" ry="28" fill="#1b2a34"/>

  <!-- brows -->
  <path fill="#c8c8c8" d="M150 158 C176 140 214 142 232 154 L228 172
    C208 162 176 162 154 176Z"/>
  <path fill="#c8c8c8" d="M362 158 C336 140 298 142 280 154 L284 172
    C304 162 336 162 358 176Z"/>

  <!-- crow's feet: two short creases fanning from each outer eye corner -->
  <g stroke="#8e8e8e" stroke-width="7" stroke-linecap="round">
    <path d="M164 198 L148 190" fill="none"/>
    <path d="M164 216 L146 220" fill="none"/>
    <path d="M348 198 L364 190" fill="none"/>
    <path d="M348 216 L366 220" fill="none"/>
  </g>

</svg>
