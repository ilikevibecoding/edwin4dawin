<?xml version="1.0" encoding="UTF-8"?>
<!--
  Hull decal: imperial warning panel.
  Raster asset, transparent background.
  Diagonal hazard stripes, a panel outline, greebled blocks and an abstract
  glyph block (filled rectangles, not lettering).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">

  <!-- panel field -->
  <rect x="24" y="24" width="464" height="464" rx="10" fill="#4a4d4a"/>
  <rect x="40" y="40" width="432" height="432" rx="6" fill="none"
        stroke="#6c6e68" stroke-width="8"/>

  <!-- hazard band: diagonal stripes inside a clipped strip -->
  <rect x="56" y="56" width="400" height="104" fill="#6c6e68"/>
  <g fill="#2f322f">
    <path d="M56 160 L112 56 L164 56 L108 160Z"/>
    <path d="M156 160 L212 56 L264 56 L208 160Z"/>
    <path d="M256 160 L312 56 L364 56 L308 160Z"/>
    <path d="M356 160 L412 56 L456 56 L456 62 L408 160Z"/>
    <path d="M56 160 L56 132 L96 56 L62 56 L56 66Z"/>
  </g>
  <rect x="56" y="56" width="400" height="104" fill="none"
        stroke="#c91a09" stroke-width="8"/>

  <!-- greebled blocks -->
  <g fill="#6c6e68">
    <rect x="56" y="192" width="128" height="34" rx="4"/>
    <rect x="56" y="238" width="92" height="34" rx="4"/>
    <rect x="160" y="238" width="24" height="34" rx="4"/>
    <rect x="56" y="284" width="128" height="18" rx="4"/>
    <rect x="204" y="192" width="66" height="110" rx="4"/>
    <rect x="286" y="192" width="46" height="46" rx="4"/>
    <rect x="286" y="252" width="46" height="50" rx="4"/>
    <rect x="352" y="192" width="104" height="24" rx="4"/>
    <rect x="352" y="228" width="104" height="24" rx="4"/>
    <rect x="352" y="264" width="70" height="38" rx="4"/>
  </g>
  <g fill="#c91a09">
    <rect x="428" y="264" width="28" height="38" rx="4"/>
    <rect x="204" y="192" width="66" height="14" rx="4"/>
  </g>

  <!-- abstract glyph block: numeric-looking bars -->
  <rect x="56" y="326" width="400" height="128" rx="6" fill="#2f322f"/>
  <g fill="#6c6e68">
    <rect x="76" y="346" width="18" height="88"/>
    <rect x="76" y="346" width="52" height="18"/>
    <rect x="76" y="416" width="52" height="18"/>
    <rect x="148" y="346" width="52" height="18"/>
    <rect x="182" y="346" width="18" height="88"/>
    <rect x="148" y="416" width="52" height="18"/>
    <rect x="220" y="346" width="18" height="88"/>
    <rect x="254" y="346" width="18" height="88"/>
    <rect x="220" y="380" width="52" height="18"/>
    <rect x="292" y="346" width="52" height="18"/>
    <rect x="292" y="346" width="18" height="88"/>
    <rect x="292" y="380" width="52" height="18"/>
    <rect x="364" y="346" width="18" height="88"/>
    <rect x="364" y="416" width="52" height="18"/>
  </g>
  <rect x="428" y="346" width="28" height="88" fill="#c91a09"/>

  <!-- corner rivets -->
  <g fill="#6c6e68">
    <circle cx="52" cy="52" r="10"/>
    <circle cx="460" cy="52" r="10"/>
    <circle cx="52" cy="460" r="10"/>
    <circle cx="460" cy="460" r="10"/>
  </g>

</svg>
