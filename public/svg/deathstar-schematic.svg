<?xml version="1.0" encoding="UTF-8"?>
<!--
  Technical readout: battle station.
  Raster asset, transparent background, stroked line art only.
  Outer hull circle, inner shell, offset superlaser dish with crosshairs,
  equatorial trench, radial measurement ticks, a bracket callout on the
  thermal port and abstract data blocks.
-->
