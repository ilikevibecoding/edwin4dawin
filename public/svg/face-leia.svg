<?xml version="1.0" encoding="UTF-8"?>
<!--
  Minifigure face print: princess.
  Raster asset. Transparent background.
  Lashed eyes, a nose dot, a calm mouth over a soft lip tone.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">

  <!-- lip tone sits under the mouth line -->
  <ellipse cx="256" cy="316" rx="46" ry="19" fill="#c9808a"/>

  <!-- eyes -->
  <ellipse cx="196" cy="210" rx="24" ry="30" fill="#1b2a34"/>
  <ellipse cx="316" cy="210" rx="24" ry="30" fill="#1b2a34"/>

  <!-- lashes at the outer corners -->
  <g stroke="#1b2a34" stroke-width="9" stroke-linecap="round" fill="none">
    <path d="M170 190 L148 176"/>
    <path d="M166 206 L142 202"/>
    <path d="M170 224 L148 232"/>
    <path d="M342 190 L364 176"/>
    <path d="M346 206 L370 202"/>
    <path d="M342 224 L364 232"/>
  </g>

  <!-- brows: fine arcs -->
  <path fill="none" stroke="#1b2a34" stroke-width="8" stroke-linecap="round"
        d="M166 158 C182 144 214 144 228 154"/>
  <path fill="none" stroke="#1b2a34" stroke-width="8" stroke-linecap="round"
        d="M346 158 C330 144 298 144 284 154"/>

  <!-- nose -->
  <ellipse cx="256" cy="262" rx="7" ry="10" fill="#1b2a34"/>

  <!-- calm mouth -->
  <path fill="none" stroke="#1b2a34" stroke-width="11" stroke-linecap="round"
        d="M216 310 C236 326 276 326 296 310"/>

</svg>
