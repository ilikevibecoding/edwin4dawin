<?xml version="1.0" encoding="UTF-8"?>
<!--
  Torso print: rebel trooper.
  Raster asset, transparent background, applied to the front of a torso brick.
  Tan flak vest over a light shirt, two chest pockets, belt with buckle.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">

  <!-- shirt showing at the neck and down the vest opening -->
  <path fill="#e4dcc4" d="M186 0 L326 0 L326 44 L276 96 L236 96 L186 44Z"/>

  <!-- flak vest, left and right panels with a gap down the middle -->
  <path fill="#b48b52" d="M60 40 L182 26 L240 104 L240 400 L60 400Z"/>
  <path fill="#b48b52" d="M452 40 L330 26 L272 104 L272 400 L452 400Z"/>

  <!-- vest edge shading -->
  <g fill="#8f6a3a">
    <path d="M240 104 L252 118 L252 400 L240 400Z"/>
    <path d="M272 104 L260 118 L260 400 L272 400Z"/>
    <path d="M60 384 L240 384 L240 400 L60 400Z"/>
    <path d="M272 384 L452 384 L452 400 L272 400Z"/>
  </g>

  <!-- chest pockets -->
  <rect x="94" y="176" width="112" height="112" rx="6" fill="#a07e48"/>
  <rect x="94" y="164" width="112" height="34" rx="6" fill="#8f6a3a"/>
  <rect x="306" y="176" width="112" height="112" rx="6" fill="#a07e48"/>
  <rect x="306" y="164" width="112" height="34" rx="6" fill="#8f6a3a"/>
  <circle cx="150" cy="196" r="8" fill="#5c4326"/>
  <circle cx="362" cy="196" r="8" fill="#5c4326"/>

  <!-- shoulder seams -->
  <g stroke="#8f6a3a" stroke-width="9" stroke-linecap="round" fill="none">
    <path d="M74 96 L158 78"/>
    <path d="M438 96 L354 78"/>
  </g>

  <!-- belt -->
  <rect x="40" y="404" width="432" height="62" fill="#5c4326"/>
  <rect x="40" y="404" width="432" height="12" fill="#3d2c19"/>
  <rect x="214" y="396" width="84" height="78" rx="6" fill="#a0a5a9"/>
  <rect x="232" y="416" width="48" height="38" rx="4" fill="#6c6e68"/>

  <!-- hip pouches -->
  <rect x="72" y="470" width="86" height="42" rx="6" fill="#8f6a3a"/>
  <rect x="354" y="470" width="86" height="42" rx="6" fill="#8f6a3a"/>

</svg>
