<?xml version="1.0" encoding="UTF-8"?>
<!--
  Rebel Alliance crest - original design.
  An upswept starbird climbing out of a broken circular ring: a narrow head
  spike on the centre line, two blade wings sweeping up and out with deep
  crescent notches between wing and body, and a tapered tail.
  Extrusion asset: two closed filled paths, single colour, no strokes.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">

  <!-- broken ring: open across the top, ends cut on a slant -->
  <path fill="#c91a09" d="M89.4 168.9
    A206 206 0 1 0 422.6 168.9
    L384.7 182
    A168 168 0 1 1 127.3 182
    Z"/>

  <!-- starbird -->
  <path fill="#c91a09" d="M256 44
    C268 96 276 152 284 206
    C322 156 380 106 452 74
    C434 140 392 208 336 254
    C330 316 320 396 296 468
    L256 496
    L216 468
    C192 396 182 316 176 254
    C120 208 78 140 60 74
    C132 106 190 156 228 206
    C236 152 244 96 256 44
    Z"/>

</svg>
