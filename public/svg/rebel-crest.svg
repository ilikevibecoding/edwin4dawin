<?xml version="1.0" encoding="UTF-8"?>
<!--
  Rebel Alliance crest - original design.
  A starbird climbing out of a broken ring: a crested head on the centre line,
  two long blade wings swept up and out past the head, deep scooped notches
  beneath them, and a body tapering to a single tail point that meets the
  bottom of the ring so the emblem extrudes as one connected piece.
  The ring is open across the top, its ends cut on a slant.
  Extrusion asset: two closed filled paths, single colour, no strokes.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">

  <!-- broken ring, centre (256,262), outer R 226 / inner R 190, 110 deg gap -->
  <path fill="#c91a09" d="M441.1 132.4
    A226 226 0 1 1 70.9 132.4
    L86.7 175.7
    A190 190 0 1 0 425.3 175.7
    Z"/>

  <!-- starbird -->
  <path fill="#c91a09" d="M256 100
    C270 128 283 158 290 190
    C322 148 392 96 470 62
    C452 148 396 210 296 262
    C286 318 274 380 256 458
    C238 380 226 318 216 262
    C116 210 60 148 42 62
    C120 96 190 148 222 190
    C229 158 242 128 256 100
    Z"/>

</svg>
