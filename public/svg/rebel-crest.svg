<?xml version="1.0" encoding="UTF-8"?>
<!--
  Rebel Alliance crest - original design.
  An upswept starbird climbing out of a broken circular ring.
  Extrusion asset: two closed filled paths, single colour, no strokes.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">

  <!-- broken ring: open 108 degrees at the top, ends cut on a slant -->
  <path fill="#c91a09" d="M89.4 168.9
    A206 206 0 1 0 422.6 168.9
    L384.7 182
    A168 168 0 1 1 127.3 182
    Z"/>

  <!-- starbird: central spire, two swept wings, forked tail -->
  <path fill="#c91a09" d="M256 34
    C267 76 275 112 285 150
    C320 126 366 106 418 100
    C396 152 356 198 306 228
    C322 286 328 348 316 418
    L256 376
    L196 418
    C184 348 190 286 206 228
    C156 198 116 152 94 100
    C146 106 192 126 227 150
    C237 112 245 76 256 34
    Z"/>

</svg>
