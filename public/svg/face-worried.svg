<?xml version="1.0" encoding="UTF-8"?>
<!--
  Minifigure face print: worried.
  Raster asset. Transparent background.
  Outer ends of the brows lifted, small eyes, open mouth, two sweat drops.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">

  <!-- brows: arched, outer ends lifted into a point, inner ends level and set
       well clear of the eyes. Determined uses straight wedges that plunge to
       the nose - these have to read differently or the two faces collide. -->
  <path fill="#1b2a34" d="M142 144
    C172 152 206 164 228 168
    L228 186
    C204 182 174 172 150 166
    Z"/>
  <path fill="#1b2a34" d="M370 144
    C340 152 306 164 284 168
    L284 186
    C308 182 338 172 362 166
    Z"/>

  <!-- small round eyes -->
  <circle cx="198" cy="226" r="21" fill="#1b2a34"/>
  <circle cx="314" cy="226" r="21" fill="#1b2a34"/>

  <!-- open mouth -->
  <ellipse cx="256" cy="318" rx="33" ry="42" fill="#1b2a34"/>

  <!-- sweat drops -->
  <path fill="#5a93db" d="M124 176 C136 200 146 214 146 226 C146 240 136 250 124 250
    C112 250 102 240 102 226 C102 214 112 200 124 176Z"/>
  <path fill="#5a93db" d="M392 202 C402 222 410 234 410 244 C410 256 402 264 392 264
    C382 264 374 256 374 244 C374 234 382 222 392 202Z"/>

</svg>
