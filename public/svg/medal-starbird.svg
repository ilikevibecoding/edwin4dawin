<?xml version="1.0" encoding="UTF-8"?>
<!--
  Medal of the Alliance - original design.
  Suspension loop, a beaded rim of 36 bosses, a heavy annular disc and the
  starbird standing inside it - its wingtips reach the rim so the whole piece
  extrudes as one connected medallion.
  Extrusion asset: closed filled paths and circles, single colour, no strokes.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 560" width="512" height="560">

  <!-- suspension loop -->
  <path fill="#dfc48e" fill-rule="evenodd" d="M210 74
    A46 46 0 0 0 302 74 A46 46 0 0 0 210 74Z
    M234 74
    A22 22 0 0 0 278 74 A22 22 0 0 0 234 74Z"/>

  <!-- beaded rim: 36 bosses set on the outside of the disc -->
  <circle cx="256" cy="124" r="11" fill="#dfc48e"/> <circle cx="290" cy="127" r="11" fill="#dfc48e"/>
  <circle cx="323" cy="135.8" r="11" fill="#dfc48e"/> <circle cx="354" cy="150.3" r="11" fill="#dfc48e"/>
  <circle cx="382" cy="169.9" r="11" fill="#dfc48e"/> <circle cx="406.1" cy="194" r="11" fill="#dfc48e"/>
  <circle cx="425.7" cy="222" r="11" fill="#dfc48e"/> <circle cx="440.2" cy="253" r="11" fill="#dfc48e"/>
  <circle cx="449" cy="286" r="11" fill="#dfc48e"/> <circle cx="452" cy="320" r="11" fill="#dfc48e"/>
  <circle cx="449" cy="354" r="11" fill="#dfc48e"/> <circle cx="440.2" cy="387" r="11" fill="#dfc48e"/>
  <circle cx="425.7" cy="418" r="11" fill="#dfc48e"/> <circle cx="406.1" cy="446" r="11" fill="#dfc48e"/>
  <circle cx="382" cy="470.1" r="11" fill="#dfc48e"/> <circle cx="354" cy="489.7" r="11" fill="#dfc48e"/>
  <circle cx="323" cy="504.2" r="11" fill="#dfc48e"/> <circle cx="290" cy="513" r="11" fill="#dfc48e"/>
  <circle cx="256" cy="516" r="11" fill="#dfc48e"/> <circle cx="222" cy="513" r="11" fill="#dfc48e"/>
  <circle cx="189" cy="504.2" r="11" fill="#dfc48e"/> <circle cx="158" cy="489.7" r="11" fill="#dfc48e"/>
  <circle cx="130" cy="470.1" r="11" fill="#dfc48e"/> <circle cx="105.9" cy="446" r="11" fill="#dfc48e"/>
  <circle cx="86.3" cy="418" r="11" fill="#dfc48e"/> <circle cx="71.8" cy="387" r="11" fill="#dfc48e"/>
  <circle cx="63" cy="354" r="11" fill="#dfc48e"/> <circle cx="60" cy="320" r="11" fill="#dfc48e"/>
  <circle cx="63" cy="286" r="11" fill="#dfc48e"/> <circle cx="71.8" cy="253" r="11" fill="#dfc48e"/>
  <circle cx="86.3" cy="222" r="11" fill="#dfc48e"/> <circle cx="105.9" cy="194" r="11" fill="#dfc48e"/>
  <circle cx="130" cy="169.9" r="11" fill="#dfc48e"/> <circle cx="158" cy="150.3" r="11" fill="#dfc48e"/>
  <circle cx="189" cy="135.8" r="11" fill="#dfc48e"/> <circle cx="222" cy="127" r="11" fill="#dfc48e"/>

  <!-- disc: annulus, outer R 190 / inner R 148 -->
  <path fill="#dfc48e" fill-rule="evenodd" d="M66 320
    A190 190 0 0 0 446 320 A190 190 0 0 0 66 320Z
    M108 320
    A148 148 0 0 0 404 320 A148 148 0 0 0 108 320Z"/>

  <!-- starbird, scaled to 0.53 of the crest drawing and centred on the disc.
       At this size the wingtips just cross the inner edge of the annulus, so
       the medallion extrudes as one connected solid. -->
  <path fill="#dfc48e" d="M256 235.2
    C263.4 250 270.3 265.9 274 282.9
    C291 260.6 328.1 233.1 369.4 215.1
    C359.9 260.6 330.2 293.5 277.2 321.1
    C271.9 350.7 265.5 383.6 256 424.9
    C246.5 383.6 240.1 350.7 234.8 321.1
    C181.8 293.5 152.1 260.6 142.6 215.1
    C183.9 233.1 221 260.6 238 282.9
    C241.7 265.9 248.6 250 256 235.2
    Z"/>

</svg>
