<?xml version="1.0" encoding="UTF-8"?>
<!--
  Medal of the Alliance - original design.
  Suspension loop, a beaded rim of 28 bosses, a heavy annular disc and the
  starbird standing free inside it (its wingtips touch the rim so the piece
  extrudes as one connected medallion).
  Extrusion asset: closed filled paths and circles, single colour, no strokes.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 560" width="512" height="560">

  <!-- suspension loop -->
  <path fill="#dfc48e" fill-rule="evenodd" d="M210 74
    A46 46 0 0 0 302 74 A46 46 0 0 0 210 74Z
    M234 74
    A22 22 0 0 0 278 74 A22 22 0 0 0 234 74Z"/>

  <!-- beaded rim: 28 bosses set on the outside of the disc -->
  <circle cx="256" cy="126" r="12" fill="#dfc48e"/> <circle cx="299.2" cy="130.9" r="12" fill="#dfc48e"/>
  <circle cx="340.2" cy="145.2" r="12" fill="#dfc48e"/> <circle cx="377" cy="168.3" r="12" fill="#dfc48e"/>
  <circle cx="407.7" cy="199" r="12" fill="#dfc48e"/> <circle cx="430.8" cy="235.8" r="12" fill="#dfc48e"/>
  <circle cx="445.1" cy="276.8" r="12" fill="#dfc48e"/> <circle cx="450" cy="320" r="12" fill="#dfc48e"/>
  <circle cx="445.1" cy="363.2" r="12" fill="#dfc48e"/> <circle cx="430.8" cy="404.2" r="12" fill="#dfc48e"/>
  <circle cx="407.7" cy="441" r="12" fill="#dfc48e"/> <circle cx="377" cy="471.7" r="12" fill="#dfc48e"/>
  <circle cx="340.2" cy="494.8" r="12" fill="#dfc48e"/> <circle cx="299.2" cy="509.1" r="12" fill="#dfc48e"/>
  <circle cx="256" cy="514" r="12" fill="#dfc48e"/> <circle cx="212.8" cy="509.1" r="12" fill="#dfc48e"/>
  <circle cx="171.8" cy="494.8" r="12" fill="#dfc48e"/> <circle cx="135" cy="471.7" r="12" fill="#dfc48e"/>
  <circle cx="104.3" cy="441" r="12" fill="#dfc48e"/> <circle cx="81.2" cy="404.2" r="12" fill="#dfc48e"/>
  <circle cx="66.9" cy="363.2" r="12" fill="#dfc48e"/> <circle cx="62" cy="320" r="12" fill="#dfc48e"/>
  <circle cx="66.9" cy="276.8" r="12" fill="#dfc48e"/> <circle cx="81.2" cy="235.8" r="12" fill="#dfc48e"/>
  <circle cx="104.3" cy="199" r="12" fill="#dfc48e"/> <circle cx="135" cy="168.3" r="12" fill="#dfc48e"/>
  <circle cx="171.8" cy="145.2" r="12" fill="#dfc48e"/> <circle cx="212.8" cy="130.9" r="12" fill="#dfc48e"/>

  <!-- disc: annulus, outer R 190 / inner R 148 -->
  <path fill="#dfc48e" fill-rule="evenodd" d="M66 320
    A190 190 0 0 0 446 320 A190 190 0 0 0 66 320Z
    M108 320
    A148 148 0 0 0 404 320 A148 148 0 0 0 108 320Z"/>

