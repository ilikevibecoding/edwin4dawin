  <path fill="#dfc48e" d="M256 177.9
    C264.1 209 270.1 235.6 277.5 263.8
    C303.4 246 337.4 231.2 375.9 226.8
    C359.6 265.2 330 299.3 293 321.5
    C304.8 364.4 309.3 410.3 300.4 462.1
