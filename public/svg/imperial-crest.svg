<?xml version="1.0" encoding="UTF-8"?>
<!--
  Imperial crest - original design.
  A heavy pointy-top hexagonal rim with a shallow square lug on each of its six
  flats, eight parallel-sided spokes running from a solid hub into the rim, and
  eight wedge voids between them. Parallel spokes and a closed hexagon
  silhouette are what keep it reading as a machined cog rather than a star.
  Extrusion asset: closed filled paths and one circle, single colour, no
  strokes. The rim uses fill-rule="evenodd" so its middle reads as a hole.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">

  <!-- hexagonal rim, outer R 238 / inner R 176 -->
  <path fill="#a0a5a9" fill-rule="evenodd" d="M256 18 L462.1 137 L462.1 375 L256 494 L49.9 375 L49.9 137Z
    M256 80 L408.4 168 L408.4 344 L256 432 L103.6 344 L103.6 168Z"/>

  <!-- six lugs, one centred on each flat, standing 20 proud of the rim -->
  <path fill="#a0a5a9" d="M452 202 L482 202 L482 310 L452 310Z"/>
  <path fill="#a0a5a9" d="M400.8 398.7 L415.8 424.7 L322.2 478.7 L307.2 452.7Z"/>
  <path fill="#a0a5a9" d="M204.8 452.7 L189.8 478.7 L96.2 424.7 L111.2 398.7Z"/>
  <path fill="#a0a5a9" d="M60 310 L30 310 L30 202 L60 202Z"/>
  <path fill="#a0a5a9" d="M111.2 113.3 L96.2 87.3 L189.8 33.3 L204.8 59.3Z"/>
  <path fill="#a0a5a9" d="M307.2 59.3 L322.2 33.3 L415.8 87.3 L400.8 113.3Z"/>

  <!-- eight spokes, hub out into the rim; every 45 deg -->
  <path fill="#a0a5a9" d="M316 226 L446 226 L446 286 L316 286Z"/>
  <path fill="#a0a5a9" d="M319.6 277.2 L411.6 369.1 L369.1 411.6 L277.2 319.6Z"/>
  <path fill="#a0a5a9" d="M286 316 L286 446 L226 446 L226 316Z"/>
  <path fill="#a0a5a9" d="M234.8 319.6 L142.9 411.6 L100.4 369.1 L192.4 277.2Z"/>
  <path fill="#a0a5a9" d="M196 286 L66 286 L66 226 L196 226Z"/>
  <path fill="#a0a5a9" d="M192.4 234.8 L100.4 142.9 L142.9 100.4 L234.8 192.4Z"/>
  <path fill="#a0a5a9" d="M226 196 L226 66 L286 66 L286 196Z"/>
  <path fill="#a0a5a9" d="M277.2 192.4 L369.1 100.4 L411.6 142.9 L319.6 234.8Z"/>

  <!-- solid hub -->
  <circle cx="256" cy="256" r="92" fill="#a0a5a9"/>

</svg>
