<?xml version="1.0" encoding="UTF-8"?>
<!--
  Cockpit console screen.
  Raster asset. NOT transparent: the dark screen field is part of the art.
  Rows of abstract data bars, a waveform trace and a circular gauge.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 320" width="512" height="320">

  <!-- screen field -->
  <rect x="0" y="0" width="512" height="320" fill="#050d14"/>
  <rect x="8" y="8" width="496" height="304" fill="none" stroke="#123040" stroke-width="4"/>

  <!-- header rule -->
  <rect x="20" y="24" width="472" height="6" fill="#123040"/>
  <rect x="20" y="24" width="120" height="6" fill="#f2cd37"/>

  <!-- left column: rows of data bars -->
  <rect x="24" y="48" width="150" height="12" rx="3" fill="#4b9f4a"/>
  <rect x="24" y="70" width="96" height="12" rx="3" fill="#4b9f4a"/>
  <rect x="24" y="92" width="132" height="12" rx="3" fill="#4b9f4a"/>
  <rect x="24" y="114" width="68" height="12" rx="3" fill="#4b9f4a"/>
  <rect x="24" y="136" width="158" height="12" rx="3" fill="#4b9f4a"/>
  <rect x="24" y="158" width="110" height="12" rx="3" fill="#4b9f4a"/>
  <rect x="24" y="180" width="140" height="12" rx="3" fill="#4b9f4a"/>
  <rect x="24" y="202" width="80" height="12" rx="3" fill="#4b9f4a"/>
  <rect x="182" y="48" width="30" height="12" rx="3" fill="#f2cd37"/>
  <rect x="128" y="70" width="30" height="12" rx="3" fill="#f2cd37"/>
  <rect x="164" y="92" width="30" height="12" rx="3" fill="#f2cd37"/>
  <rect x="190" y="136" width="22" height="12" rx="3" fill="#f2cd37"/>
  <rect x="172" y="180" width="22" height="12" rx="3" fill="#f2cd37"/>

  <!-- lower ladder bars -->
  <rect x="24" y="234" width="188" height="10" rx="3" fill="#123040"/>
  <rect x="24" y="252" width="188" height="10" rx="3" fill="#123040"/>
  <rect x="24" y="270" width="188" height="10" rx="3" fill="#123040"/>
  <rect x="24" y="288" width="188" height="10" rx="3" fill="#123040"/>
  <rect x="24" y="234" width="122" height="10" rx="3" fill="#4b9f4a"/>
  <rect x="24" y="252" width="164" height="10" rx="3" fill="#4b9f4a"/>
  <rect x="24" y="270" width="72" height="10" rx="3" fill="#4b9f4a"/>
  <rect x="24" y="288" width="140" height="10" rx="3" fill="#4b9f4a"/>

  <!-- waveform panel -->
  <rect x="236" y="44" width="152" height="106" fill="none" stroke="#123040" stroke-width="3"/>
  <path fill="none" stroke="#123040" stroke-width="2" d="M236 97 L388 97"/>
  <polyline fill="none" stroke="#f2cd37" stroke-width="3" stroke-linejoin="round"
            points="242,97 254,97 262,68 270,126 278,84 286,97 300,97 308,74
                    316,118 324,90 332,97 348,97 356,62 364,130 372,97 384,97"/>

  <!-- gauge -->
  <circle cx="428" cy="222" r="64" fill="#08161f" stroke="#123040" stroke-width="4"/>
  <circle cx="428" cy="222" r="48" fill="none" stroke="#123040" stroke-width="2"/>
  <g stroke="#4b9f4a" stroke-width="4" stroke-linecap="round">
    <path d="M380 222 L392 222" fill="none"/>
    <path d="M394 188 L403 197" fill="none"/>
    <path d="M428 174 L428 186" fill="none"/>
    <path d="M462 188 L453 197" fill="none"/>
    <path d="M476 222 L464 222" fill="none"/>
  </g>
  <path fill="none" stroke="#f2cd37" stroke-width="5" stroke-linecap="round"
        d="M428 222 L462 190"/>
  <circle cx="428" cy="222" r="9" fill="#f2cd37"/>

  <!-- gauge label bars -->
  <rect x="368" y="298" width="120" height="8" rx="3" fill="#123040"/>
  <rect x="368" y="298" width="46" height="8" rx="3" fill="#4b9f4a"/>

  <!-- right hand status pips -->
  <rect x="404" y="52" width="16" height="16" rx="3" fill="#4b9f4a"/>
  <rect x="428" y="52" width="16" height="16" rx="3" fill="#4b9f4a"/>
  <rect x="452" y="52" width="16" height="16" rx="3" fill="#f2cd37"/>
  <rect x="404" y="76" width="16" height="16" rx="3" fill="#f2cd37"/>
  <rect x="428" y="76" width="16" height="16" rx="3" fill="#123040"/>
  <rect x="452" y="76" width="16" height="16" rx="3" fill="#123040"/>
  <rect x="404" y="100" width="16" height="16" rx="3" fill="#123040"/>
  <rect x="428" y="100" width="16" height="16" rx="3" fill="#123040"/>
  <rect x="452" y="100" width="16" height="16" rx="3" fill="#123040"/>

</svg>
