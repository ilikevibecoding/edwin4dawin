name: Deploy play build to GitHub Pages

# Runs on the pre-built snapshot branch that tools/publish-play.sh pushes (the branch *is* the static site, so
# there is no build step). GitHub Pages must be enabled once by a repo admin: Settings → Pages → Build and
# deployment → Source: "GitHub Actions". Until then the run exits green with a notice instead of failing, because
# the workflow token cannot enable Pages itself ("Resource not accessible by integration").
on:
  push:
    branches: [cursor/play-6ead]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check that GitHub Pages is enabled
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .html_url >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages is not enabled for ${GITHUB_REPOSITORY}. Enable it (Settings → Pages → Source: GitHub Actions), then re-run this workflow."
          fi

      - uses: actions/checkout@v4
        if: steps.pages.outputs.enabled == 'true'

      - name: Drop git metadata from the artifact
        if: steps.pages.outputs.enabled == 'true'
        run: rm -rf .git

      - uses: actions/configure-pages@v5
        if: steps.pages.outputs.enabled == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outputs.enabled == 'true'
        with:
          path: .

      - id: deployment
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4
