<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SD Deck 1 — dev harness (Agent B)</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="../../../style.css" />
    <!-- Bare specifiers for the no-Vite case (the page served straight from GitHub via jsDelivr). Under the Vite dev
         server these are never consulted: Vite rewrites the imports to its pre-bundled deps first. Versions match
         package.json / package-lock.json. -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/",
          "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/",
          "n8ao": "https://cdn.jsdelivr.net/npm/n8ao@2.0.1/dist/N8AO.js",
          "postprocessing": "https://cdn.jsdelivr.net/npm/postprocessing@6.39.4/build/index.js"
        }
      }
    </script>
  </head>
  <body>
    <canvas id="view"></canvas>

    <div id="hud">
      <div id="crosshair"></div>
      <div id="prompt" class="hidden"></div>
      <div id="status">
        <span id="status-tag">DECK 1</span>
        <span id="status-text">Dev harness. Loading modules…</span>
      </div>
      <div id="stats" class="hidden"></div>
    </div>

    <div id="fade">
      <div id="fade-text"></div>
    </div>

    <div id="start">
      <div class="card">
        <h1>DECK 1</h1>
        <p class="sub">command tower · dev harness</p>
        <p class="hint">Click to take the deck</p>
        <p class="keys">WASD move · mouse look · F3 stats · ?rooms=id,id · ?spawn=id</p>
      </div>
    </div>

    <script type="module" src="./harness.js"></script>
  </body>
</html>
