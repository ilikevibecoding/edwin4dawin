<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SD Deck 1 — dev harness (Agent B)</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="view"></canvas>

    <div id="hud">
      <div id="crosshair"></div>
      <div id="prompt" class="hidden"></div>
      <div id="status">
        <span id="status-tag">DECK 1</span>
        <span id="status-text">Dev harness. Loading modules…</span>
      </div>
      <div id="stats" class="hidden"></div>
    </div>

    <div id="fade">
      <div id="fade-text"></div>
    </div>

    <div id="start">
      <div class="card">
        <h1>DECK 1</h1>
        <p class="sub">command tower · dev harness</p>
        <p class="hint">Click to take the deck</p>
        <p class="keys">WASD move · mouse look · F3 stats · ?rooms=id,id · ?spawn=id</p>
      </div>
    </div>

    <script type="module" src="./harness.js"></script>
  </body>
</html>
